<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제휴 문의</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>서비스</h1>
        <div style="margin-bottom: 40px; border-bottom: 1px solid #eee; padding-bottom: 20px;">
            <h2>자전거 분류</h2>
            <input type="file" id="image-upload" accept="image/*" style="display: block; margin-bottom: 10px;">
            <img id="uploaded-image" src="#" alt="업로드된 이미지" style="max-width: 100%; max-height: 200px; margin-top: 10px; display: none;">
            <button id="classify-button" type="button" disabled style="margin-top: 10px;">분류 시작</button>
            <div id="prediction-results" style="margin-top: 15px; font-weight: 600; color: #333;"></div>
        </div>

        <h2>제휴 문의</h2>
        <form action="https://formspree.io/f/maqodggo" method="POST">
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="company">회사명</label>
                <input type="text" id="company" name="company">
            </div>
            <div class="form-group">
                <label for="message">문의 내용</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit">보내기</button>
        </form>
        <div id="disqus_thread" style="margin-top: 40px;"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/BsKCidTnx/";
        let model, maxPredictions;

        const imageUpload = document.getElementById("image-upload");
        const uploadedImage = document.getElementById("uploaded-image");
        const classifyButton = document.getElementById("classify-button");
        const predictionResults = document.getElementById("prediction-results");

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // Load the model
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // Setup event listeners
            imageUpload.addEventListener("change", handleImageUpload);
            classifyButton.addEventListener("click", classifyImage);

            predictionResults.innerHTML = "모델 로딩 완료. 이미지를 업로드해주세요.";
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImage.src = e.target.result;
                    uploadedImage.style.display = "block";
                    classifyButton.disabled = false;
                    predictionResults.innerHTML = ""; // Clear previous results
                };
                reader.readAsDataURL(file);
            } else {
                uploadedImage.style.display = "none";
                classifyButton.disabled = true;
                predictionResults.innerHTML = "";
            }
        }

        async function classifyImage() {
            if (!uploadedImage.src || uploadedImage.style.display === "none") {
                predictionResults.innerHTML = "이미지를 먼저 업로드해주세요.";
                return;
            }

            predictionResults.innerHTML = "분류 중...";
            classifyButton.disabled = true; // Disable button during prediction

            const prediction = await model.predict(uploadedImage);

            let resultsHtml = "분류 결과:<br>";
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(2) + "%";
                resultsHtml += `<div>${classPrediction}</div>`;
            }
            predictionResults.innerHTML = resultsHtml;
            classifyButton.disabled = false; // Re-enable button
        }

        // Initialize the model when the page loads
        init();
    </script>

</html>
